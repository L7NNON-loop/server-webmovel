services:
  - type: web
    name: telegram-automation-api
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SESSION_STORE_PATH
        value: data/sessions.json
